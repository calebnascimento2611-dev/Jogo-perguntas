 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🎯 Jogo de Perguntas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;min-height:100%;}
body{
    background:linear-gradient(135deg,#e3f2fd,#bbdefb);
    font-family:Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}
.caixa{
    background:#fff;
    width:100%;
    min-height:95vh;
    border-radius:20px;
    padding:40px 25px;
    box-shadow:0 6px 20px rgba(0,0,0,0.15);
    display:flex;
    flex-direction:column;
}
h1{color:#1976d2;font-size:clamp(24px,6vw,36px);margin-bottom:20px;text-align:center;}
.nivel{
    display:inline-block;
    padding:8px 20px;
    border-radius:25px;
    font-size:clamp(14px,3vw,18px);
    margin-bottom:25px;
    font-weight:bold;
    align-self:center;
}
.n1{background:#c8e6c9;color:#2e7d32;}
.n2{background:#fff9c4;color:#f57c00;}
.n3{background:#ffd8b1;color:#e65100;}
.n4{background:#ffcdd2;color:#c62828;}
.n5{background:#e1bee7;color:#7b1fa2;}
#pergunta{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 0;}
h2{font-size:clamp(20px,5vw,32px);color:#222;text-align:center;line-height:1.4;}
#respostas{margin-top:10px;}
button{
    width:100%;
    padding:clamp(14px,4vw,22px);
    margin:10px 0;
    font-size:clamp(16px,4vw,22px);
    border:none;
    border-radius:12px;
    background:#2196f3;
    color:#fff;
    cursor:pointer;
    transition:0.2s;
}
button:hover{background:#1976d2;transform:scale(1.02);}
#placar{
    font-size:clamp(20px,5vw,28px);
    font-weight:bold;
    color:#333;
    margin-top:25px;
    text-align:center;
    padding-top:15px;
    border-top:2px solid #eee;
}
</style>
</head>

let indice=0, pontos=0;
const nomesNivel=["","Nível 1/5 — Muito Fácil","Nível 2/5 — Fácil","Nível 3/5 — Médio","Nível 4/5 — Difícil","Nível 5/5 — Muito Difícil"];
const classeNivel=["","n1","n2","n3","n4","n5"];

function carregar(){
    const p=PERGUNTAS[indice];
    document.getElementById("nivel").textContent=nomesNivel[p.nivel];
    document.getElementById("nivel").className="nivel "+classeNivel[p.nivel];
    document.getElementById("pergunta").innerHTML="<h2>"+p.texto+"</h2>";
    const div=document.getElementById("respostas");
    div.innerHTML="";
    p.respostas.forEach((r,i)=>{
        const b=document.createElement("button");
        b.textContent=r;
        b.onclick=()=>verificar(i);
        div.appendChild(b);
    });
}

function verificar(i){
    if(i===PERGUNTAS[indice].certa){pontos++;alert("✅ Acertou!");}
    else alert("❌ Errou!");
    indice++;
    if(indice<PERGUNTAS.length) carregar();
    else {
        document.getElementById("nivel").textContent="🏆 Fim!";
        document.getElementById("nivel").className="nivel n5";
        document.getElementById("pergunta").innerHTML="<h2>Parabéns!</h2>";
        document.getElementById("respostas").innerHTML="<h3>Você fez "+pontos+" de "+PERGUNTAS.length+" pontos!</h3>";
    }
    document.getElementById("placar").textContent="Pontos: "+pontos;
}

carregar();
